name: Check and publish
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 4 * * *"
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify reproducibility and prepare one release archive
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm run test:reproducibility --workspace @codeursenior/boyscout
          mkdir -p .local/distribution
          npm pack --workspace @codeursenior/boyscout --ignore-scripts --pack-destination .local/distribution
          npm exec --workspace @codeursenior/boyscout -- tsc -p tsconfig.tools.json
          cp packages/agent-visualizer/.local/tools/package-smoke.js .local/distribution/package-smoke.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: boyscout-package
          include-hidden-files: true
          path: .local/distribution/
  browser:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm exec --workspace @codeursenior/boyscout -- playwright install chromium
      - run: npm run test:e2e --workspace @codeursenior/boyscout
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          include-hidden-files: true
          path: packages/agent-visualizer/.local/playwright-results
  package:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: boyscout-package
          path: ${{ runner.temp }}/boyscout-artifact
      - name: Test the archive without a checkout or development dependencies
        shell: bash
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/boyscout-artifact
        run: |
          archives=("$ARTIFACT_ROOT"/*.tgz)
          node "$ARTIFACT_ROOT/package-smoke.mjs" "${archives[0]}"
  publish:
    needs: [check, browser, package]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run check
      - name: Compare publishable files with npm
        id: release
        run: npm run release:status
      - name: Reject a reused or unnecessary version
        env:
          CHANGED: ${{ steps.release.outputs.changed }}
          LOCAL_VERSION: ${{ steps.release.outputs.local_version }}
          PUBLISHED_VERSION: ${{ steps.release.outputs.published_version }}
          NEXT_VERSION: ${{ steps.release.outputs.next_version }}
        run: |
          if [[ "$CHANGED" == 'true' && "$LOCAL_VERSION" != "$NEXT_VERSION" ]]; then
            echo "Package files changed without an unpublished version" >&2
            exit 1
          fi
          if [[ "$CHANGED" == 'false' && "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]]; then
            echo "Package version changed without publishable file changes" >&2
            exit 1
          fi
      - name: Publish changed package
        if: steps.release.outputs.changed == 'true'
        run: npm publish --workspace @codeursenior/boyscout --access public
      - name: Verify npm latest
        if: steps.release.outputs.changed == 'true'
        env:
          LOCAL_VERSION: ${{ steps.release.outputs.local_version }}
        run: |
          # npm may accept a publish while the new version is still processing.
          for attempt in {1..40}; do
            if published="$(npm view @codeursenior/boyscout@latest version --prefer-online)"; then
              if [[ "$published" == "$LOCAL_VERSION" ]]; then exit 0; fi
            fi
            sleep 15
          done
          echo "npm latest did not advance to $LOCAL_VERSION" >&2
          exit 1
