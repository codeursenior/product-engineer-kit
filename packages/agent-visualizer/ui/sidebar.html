<a class="brand" href="#">
  @if (avatar(); as image) {
  <img
    class="agent-avatar"
    [src]="image"
    alt=""
    width="198"
    height="198"
    (error)="failedAvatar.set(image)"
  />
  } @else {
  <img src="/favicon.svg" alt="" width="198" height="198" />
  }
  <span class="brand-text"
    ><span class="agent-name" [title]="state.data()?.agent?.name ?? 'boyscout'"
      >{{ state.data()?.agent?.name ?? 'boyscout' }}</span
    ><span class="brand-sub">Agent Visualizer</span></span
  >
</a>
<div class="workspace">
  <span class="eyebrow">Workspace</span
  ><strong id="project-name"
    >{{ state.data()?.project?.name ?? 'Loading workspace' }}</strong
  ><span
    id="project-path"
    class="mono"
    [title]="state.data()?.project?.path ?? ''"
    >{{ state.data()?.project?.path }}</span
  >
</div>
<nav aria-label="Views">
  @for (tab of tabs; track tab.id) {
  <button
    class="nav-item"
    [class.active]="state.tab() === tab.id"
    [attr.data-tab]="tab.id"
    [attr.aria-current]="state.tab() === tab.id ? 'page' : 'false'"
    (click)="state.selectTab(tab.id)"
  >
    <span class="nav-icon" aria-hidden="true">{{ tab.icon }}</span>{{ tab.label
    }}<span
      [hidden]="tab.id === 'optimizer' || tab.id === 'checklist'"
      [id]="'count-' + tab.id"
      class="count"
      >{{ count(tab.id) }}</span
    >
  </button>
  }
</nav>
<div class="sidebar-rescan">
  <button
    id="refresh"
    class="small-button"
    [disabled]="state.loading()"
    (click)="refresh()"
  >
    ↻ <span>Rescan</span>
  </button>
  <button
    id="theme-toggle"
    class="small-button"
    type="button"
    [attr.aria-label]="state.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
    [title]="state.theme() === 'dark' ? 'Light mode' : 'Dark mode'"
    [attr.aria-pressed]="state.theme() === 'dark'"
    (click)="state.toggleTheme()"
  >
    {{ state.theme() === 'dark' ? '☀' : '☾' }}
  </button>
</div>
