<div class="graph-key">
  <span><i class="dot project"></i>Project context</span
  ><span><i class="dot user"></i>User context</span
  ><span><i class="key-line"></i>Reference</span
  ><span><i class="key-line dashed"></i>Folder scope</span>
</div>
<div class="graph-controls">
  <button id="zoom-in" aria-label="Zoom in" (click)="handle?.zoomIn()">+</button
  ><button id="zoom-out" aria-label="Zoom out" (click)="handle?.zoomOut()">
    −</button
  ><button id="fit" aria-label="Fit graph" (click)="handle?.fit()">Fit</button>
</div>
<div class="graph-hint">Scroll to zoom · Drag to explore · Click a file</div>
